<header class="app-header">
  <div class="container bar">
    <a class="brand" routerLink="/orders">
      <span class="logo" aria-hidden="true">K</span>
      <span class="brand-text">{{ 'app.brand' | t }}</span>
    </a>
    <nav aria-label="Main">
      <a class="link" routerLink="/orders" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        {{ 'nav.board' | t }}
      </a>
      <button
        type="button"
        class="btn btn--secondary btn--sm theme"
        [attr.aria-label]="'nav.theme' | t"
        [attr.aria-pressed]="theme.theme() === 'dark'"
        (click)="theme.toggle()"
      >
        <!-- Drawn icons: the sun/moon characters look different (or tiny) on some phones. -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          @if (theme.theme() === 'dark') {
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          } @else {
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          }
        </svg>
      </button>
      <button
        type="button"
        class="btn btn--secondary btn--sm lang"
        [attr.aria-label]="'nav.switchLanguage' | t"
        (click)="i18n.toggle()"
      >
        {{ 'nav.languageName' | t }}
      </button>
      <a class="btn btn--primary" routerLink="/orders/new">{{ 'nav.newOrder' | t }}</a>
    </nav>
  </div>
</header>

<main class="container">
  <router-outlet />
</main>
